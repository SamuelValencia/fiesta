<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta regresiva: fiesta de Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#12071d; --plum:#2a1040; --pumpkin:#ff7a18; --bone:#f3ead7; --slime:#9be564;
  --font-display:'Pirata One','Old English Text MT',Georgia,serif;
  --font-body:'Spectral',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,var(--plum) 0%,var(--night) 65%);
  background-color:var(--night);
  color:var(--bone);font-family:var(--font-body);text-align:center;overflow-x:hidden;
}
main{width:100%;max-width:720px;padding:32px 20px 48px;position:relative}
.moon{
  width:clamp(110px,26vw,160px);aspect-ratio:1;margin:0 auto 20px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff3d1,#f0c36b 70%,#d99a3a);
  box-shadow:0 0 60px 10px rgba(255,170,60,.35);position:relative;
}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 62% 30%,rgba(120,80,20,.25) 0 9%,transparent 10%),
    radial-gradient(circle at 36% 62%,rgba(120,80,20,.22) 0 12%,transparent 13%),
    radial-gradient(circle at 70% 68%,rgba(120,80,20,.2) 0 6%,transparent 7%);}
.bat{position:absolute;top:18px;left:-60px;width:44px;fill:var(--night);
  filter:drop-shadow(0 0 1px var(--bone));animation:fly 9s ease-in-out 0.6s 1 forwards;opacity:0}
@keyframes fly{
  0%{transform:translate(0,0) scale(.8);opacity:0}
  10%{opacity:1}
  50%{transform:translate(380px,-30px) scale(1)}
  100%{transform:translate(860px,20px) scale(.7);opacity:0}
}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,7vw,3.2rem);margin:0 0 4px;letter-spacing:.02em}
.sub{margin:0 0 28px;font-style:italic;opacity:.8;font-size:1.05rem}
.days{
  font-family:var(--font-display);line-height:.9;color:var(--pumpkin);
  font-size:clamp(7rem,32vw,13rem);
  text-shadow:0 0 28px rgba(255,122,24,.55),0 0 2px #fff4;
  margin:0;
}
.days-label{font-size:clamp(1.3rem,4.5vw,1.8rem);margin:4px 0 28px}
.units{display:flex;justify-content:center;gap:12px;margin-bottom:32px}
.unit{min-width:76px;padding:12px 10px;border:1px solid rgba(243,234,215,.25);border-radius:14px;background:rgba(18,7,29,.55)}
.unit b{display:block;font-family:var(--font-display);font-weight:400;font-size:2.2rem;color:var(--slime)}
.unit span{font-size:.9rem;opacity:.75}
.date{margin:0;font-size:1.05rem}
.date strong{color:var(--pumpkin);font-weight:600}
.party{display:none}
.is-party .party{display:block}
.is-party .count{display:none}
.party h2{font-family:var(--font-display);font-weight:400;font-size:clamp(3rem,13vw,6rem);color:var(--pumpkin);margin:12px 0;text-shadow:0 0 28px rgba(255,122,24,.55)}
@media (max-width:420px){.units{gap:8px}.unit{min-width:64px}.unit b{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){.bat{display:none}}
</style>
</head>
<body>
<main id="app">
  <svg class="bat" viewBox="0 0 64 32" aria-hidden="true"><path d="M32 10c-3-4-6-7-10-7-4 0-8 3-14 3 4 2 5 5 5 8-3 0-6 1-9 4 5 0 8 1 10 4 2-3 4-4 7-4 1 3 4 5 8 6l3 4 3-4c4-1 7-3 8-6 3 0 5 1 7 4 2-3 5-4 10-4-3-3-6-4-9-4 0-3 1-6 5-8-6 0-10-3-14-3-4 0-7 3-10 7z"/></svg>
  <div class="moon" aria-hidden="true"></div>
  <h1>Fiesta de Halloween</h1>
  <p class="sub">La noche más oscura del año se acerca</p>

  <section class="count" aria-live="polite">
    <p class="days" id="days">--</p>
    <p class="days-label" id="daysLabel">días para la fiesta</p>
    <div class="units">
      <div class="unit"><b id="h">--</b><span>horas</span></div>
      <div class="unit"><b id="m">--</b><span>minutos</span></div>
      <div class="unit"><b id="s">--</b><span>segundos</span></div>
    </div>
  </section>

  <section class="party">
    <h2 id="partyTitle">¡Es hoy!</h2>
    <p>Disfraces listos, que empiece la fiesta.</p>
  </section>

  <p class="date">Nos vemos el <strong>30 de octubre de 2026</strong></p>
</main>

<script>
// Para cambiar la fecha: edita esta línea (año-mes-día, hora de Ecuador UTC-5).
var FIESTA = new Date('2026-10-30T00:00:00-05:00');
// Duración del día de la fiesta (24 h). Después de eso se muestra "ya pasó".
var DIA_MS = 24*60*60*1000;

var $ = function(id){return document.getElementById(id)};
function pad(n){return String(n).padStart(2,'0')}

function tick(){
  var diff = FIESTA - new Date();
  var app = $('app');
  if (diff <= 0){
    app.classList.add('is-party');
    $('partyTitle').textContent = (-diff < DIA_MS) ? '¡Es hoy!' : 'La fiesta ya pasó';
    return;
  }
  app.classList.remove('is-party');
  var d = Math.floor(diff/86400000);
  var h = Math.floor(diff/3600000)%24;
  var m = Math.floor(diff/60000)%60;
  var s = Math.floor(diff/1000)%60;
  $('days').textContent = d;
  $('daysLabel').textContent = (d === 1 ? 'día' : 'días') + ' para la fiesta';
  $('h').textContent = pad(h);
  $('m').textContent = pad(m);
  $('s').textContent = pad(s);
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
